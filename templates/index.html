<!DOCTYPE html>
<html>
<head>
    <title>Simple Posts</title>
</head>

<body>

    <h1>My Posts</h1>

    <form action="/add" method="POST">

        <input
            type="text"
            name="title"
            placeholder="Post Title"
            required
        >

        <br><br>

        <textarea
            name="content"
            placeholder="Write your post"
            required
        ></textarea>

        <br><br>

        <button type="submit">Add Post</button>

    </form>



</body>
</html>
